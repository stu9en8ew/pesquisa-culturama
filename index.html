<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="culturama-favico.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Work+Sans&display=swap" rel="stylesheet">

    <title>Pesquisa Culturama</title>
</head>

<body>
     <header>
        <img src="img/logo-culturama.png" alt="logo culturama">
        <h1>Pesquisa de opiniao</h1>
    </header>
    <section>
        <form action="sucesso.html" method="get">
            <fieldset>

                <!--DADOS PESSOAIS-->
                <legend>Dados Pessoais</legend>
                <label for="name">Nome</label>
                <input id="name" type="text" name="userName">
                <br>
                <label for="age">Idade</label>
                <input id="age" type="number" min="12" max="100" name="userAge" required>
                <br>
                <label for="birthDate">Data de Nascimento</label>
                <input id="birthDate" type="date" name="userbBirthDate">
                <br>
                <label for="email">Email</label>
                <input id="email" type="email" name="userEmail" required>
                <br>
                <label for="phoneNumber">Telefone</label>
                <input id="phoneNumber" type="tel" name="userPhoneNumber" pattern="[0-9]{11}" placeholder="DDD + número sem espaços ou hifen" aria-describedby="phoneHelp">
                <small id="phoneHelp">Preencha com 11 digitos no formato: DDD + numero sem espaços ou hifen.</small>
                <br>
                <label for="image">Upload de foto</label>
                <input id="image" type="file" accept="image/*" name="userImage" aria-describedby="imageHelp">
                <small id="imageHelp">Envie uma foto no formato PNG ou JPEG</small>
                <br>
            </fieldset> 
            
            <fieldset>
                <legend>Perfil</legend>
                <p>Gênero:</p>
                <input id="fem" type="radio" name="userGender" value="Feminino">
                <label for="fem">Feminino</label>
                <input id="masc" type="radio" name="userGender" value="Masculino">
                <label for="masc">Masculino</label>
                <input id="notInformed" type="radio" name="userGender" value="notInformed">
                <label for="notInformed">Prefiro não informar</label>
                <br>
                <label for="maritalStatus">Estado civil:</label>
                <select id="maritalStatus" name="userMaritalStatus">
                    <option value="notInformed">Selecione...</option>
                    <option value="casado">Casado</option>
                    <option value="solteiro">Solteiro</option>
                    <option value="divorciado">Divorciado</option>
                    <option value="casado">União estável</option>
                </select>

                <label for="state">Estado:</label>
                <select id="state" name="userState">
                    <option value="acre">Acre</option>
                    <option value="alagoas">Alagoas</option>
                    <option value="amapa">Amapá</option>
                    <option value="amazonas">Amazonas</option>
                    <option value="bahia">Bahia</option>
                    <option value="ceara">Ceará</option>
                    <option value="distritoFederal">Distrito Federal</option>
                    <option value="espiritoSanto">Espirito Santo</option>
                    <option value="goias">Goiás</option>
                    <option value="maranhao">Maranhão</option>
                    <option value="matoGrossoDoSul">Mato Grosso do Sul</option>
                    <option value="matoGrosso">Mato Grosso</option>
                    <option value="minasGerais">Minas Gerais</option>
                    <option value="para">Pará</option>
                    <option value="paraiba">Paraíba</option>
                    <option value="parana">Paraná</option>
                    <option value="pernambuco">Pernambuco</option>
                    <option value="piaui">Piauí</option>
                    <option value="rioDeJaneiro">Rio de Janeiro</option>
                    <option value="rioGrandeDoNorte">Rio Grande do Norte</option>
                    <option value="rioGrandeDoSul">Rio Grande do Sul</option>
                    <option value="rondonia">Rondônia</option>
                    <option value="roraima">Roraima</option>
                    <option value="santaCatarina">Santa Catarina</option>
                    <option value="saoPaulo">São Paulo</option>
                    <option value="sergipe">Sergipe</option>
                    <option value="tocantins">Tocantins</option>
                </select>

                <label for="city">Cidade:</label>
                <input type="text" id="city" name="userCity" autocomplete="address-level2" placeholder="Ex.: Fortaleza" />

            </fieldset>

            <fieldset> 
                <legend>Habitos</legend>
                <p>Redes Sociais:</p>
                <input id="instagram" type="checkbox" name="social" value="instagram"><label for="instagram">Instagram</label>
                <br>
                <input id="facebook" type="checkbox" name="social" value="facebook"><label for="facebook">Facebook</label>
                <br>
                <input id="linkedin" type="checkbox" name="social" value="linkedin"><label for="linkedin">Linkedin</label>
                <br>
                <input id="x" type="checkbox" name="social" value="x"><label for="x">X</label>
                <br>

                <label for="musicStyle">Estilo Musical :</label>
                <input list="styleTypes" id="musicStyle" type="text" name="userMusicStyle">
                <datalist id="styleTypes">
                    <option value="Rock">
                    <option value="Pop">
                    <option value="Samba">
                    <option value="Sertanejo">
                </datalist>
                <br>

                <label for="favoriteColor">Cor favorita</label>
                <input type="color" name="userFavoriteCololor" id="favoriteColor">

            </fieldset>
            
            <br>
            <fieldset>
                <legend>Opiniao</legend>
                <p>O que voce acha da qualidade do nosso servico ?</p>
                <input id="otima" type="radio" name="userExperience" value="otima"><label for="otima">Otima</label>
                <br>
                <input id="boa" type="radio" name="userExperience" value="boa"><label for="boa">Boa</label>
                <br>
                <input id="regular" type="radio" name="userExperience" value="regular"><label for="regular">Regular</label>
                <br>
                <input id="ruim" type="radio" name="userExperience" value="ruim"><label for="ruim">Ruim</label>

                <br>
                <label for="comentario">Escreva a sua opiniao</label>
                <textarea name="userComment" id="comentario" placeholder="Digite aqui..."></textarea>

            </fieldset>

            <fieldset>
                <legend>Confirmacoes</legend>
                <input id="userLgpdTerm" type="checkbox" name="userLgpd" value="accepted" required><label for="userLgpdTerm">Eu aceito participar da pesquisa</label>
                <br>
                <input id="getResult" type="checkbox" name="userGetResult" value="accepted"><label for="getResult">Desejo receber o resultado por email</label>
            </fieldset>

            <button type="submit">Enviar</button>
            <button type="reset">Limpar</button>
        </form>
    </section>   
</body>
</html>
